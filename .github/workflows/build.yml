name: Build QMK Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: master
          path: qmk_firmware
          submodules: recursive

      - name: Install Dependencies
        run: |
          pip install -r qmk_firmware/requirements.txt

      - name: Copy Keyboard Definition into QMK
        run: |
          mkdir -p qmk_firmware/keyboards/sofle_choc_mroaks
          cp -r keyboards/sofle_choc_mroaks/* qmk_firmware/keyboards/sofle_choc_mroaks/

      - name: Build mroaks keymap
        run: |
          cd qmk_firmware
          qmk compile -kb sofle_choc_mroaks -km mroaks

      - name: Build army keymap
        run: |
          cd qmk_firmware
          qmk compile -kb sofle_choc_mroaks -km army || echo "Army build finished"

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sofle-choc-firmware
          path: |
            qmk_firmware/*.hex
            qmk_firmware/.build/*.hex
