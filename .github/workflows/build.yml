name: Build QMK Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Setup Keyboard in QMK
        run: |
          git config --global --add safe.directory '*'
          qmk config user.qmk_home=$(pwd)
          mkdir -p keyboards/sofle_choc_mroaks
          cp -r my_keyboard/keyboards/sofle_choc_mroaks/* keyboards/sofle_choc_mroaks/
          mkdir -p keyboards/sofle_choc
          cp -r my_keyboard/keyboards/sofle_choc_mroaks/* keyboards/sofle_choc/

      - name: Build mroaks Left side
        run: |
          make sofle_choc:mroaks_left 2>&1 | tee build_mroaks_left.log

      - name: Build mroaks Right side
        run: |
          make sofle_choc:mroaks_right 2>&1 | tee build_mroaks_right.log

      - name: Build mroaks Unified
        run: |
          make sofle_choc:mroaks 2>&1 | tee build_mroaks_unified.log

      - name: Build default keymap
        run: |
          make sofle_choc:default 2>&1 | tee build_default.log || echo "Default build skipped"

      - name: Collect Firmware Files
        if: always()
        run: |
          mkdir -p firmware_binaries
          find . -maxdepth 3 -name "*.hex" -exec cp -v {} firmware_binaries/ \; || true
          find . -maxdepth 3 -name "*.bin" -exec cp -v {} firmware_binaries/ \; || true
          cp -v *.log firmware_binaries/ || true
          ls -la firmware_binaries/

      - name: Summary & Logs
        if: always()
        run: |
          echo "### QMK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Firmware compilation completed for split keyboard:" >> $GITHUB_STEP_SUMMARY
          echo "- **Left Half:** \`sofle_choc_mroaks_left.hex\` (Layer status, Lock status, Modifiers, Keylogger)" >> $GITHUB_STEP_SUMMARY
          echo "- **Right Half:** \`sofle_choc_mroaks_right.hex\` (Mr. Oaks Logo, WPM counter, Luna the Dog animation)" >> $GITHUB_STEP_SUMMARY
          echo "- **Unified:** \`sofle_choc_mroaks.hex\` (Dynamic autodetection)" >> $GITHUB_STEP_SUMMARY

      - name: Archive Firmware Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofle-choc-firmware
          path: firmware_binaries/*
