name: Build QMK Firmware

on:
  push:
    branches: [main, master, release-via]
  pull_request:
    branches: [main, master, release-via]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Setup Keyboard in QMK
        run: |
          git config --global --add safe.directory '*'
          qmk config user.qmk_home=$(pwd)
          mkdir -p keyboards/sofle_choc_mroaks
          cp -r my_keyboard/keyboards/sofle_choc_mroaks/* keyboards/sofle_choc_mroaks/
          mkdir -p keyboards/sofle_choc
          cp -r my_keyboard/keyboards/sofle_choc_mroaks/* keyboards/sofle_choc/

      - name: Build via Left side (VIA + Spanish ISO)
        run: |
          qmk compile -kb sofle_choc_mroaks -km via_left 2>&1 | tee build_via_left.log || echo "via_left failed"

      - name: Build via Right side (VIA + Ikki Animation)
        run: |
          qmk compile -kb sofle_choc_mroaks -km via_right 2>&1 | tee build_via_right.log || echo "via_right failed"

      - name: Build via Unified
        run: |
          qmk compile -kb sofle_choc_mroaks -km via 2>&1 | tee build_via_unified.log || echo "via_unified skipped/failed"

      - name: Build mroaks Left side
        run: |
          qmk compile -kb sofle_choc_mroaks -km mroaks_left 2>&1 | tee build_mroaks_left.log || echo "mroaks_left skipped"

      - name: Build mroaks Right side
        run: |
          qmk compile -kb sofle_choc_mroaks -km mroaks_right 2>&1 | tee build_mroaks_right.log || echo "mroaks_right skipped"

      - name: Build default keymap
        run: |
          qmk compile -kb sofle_choc_mroaks -km default 2>&1 | tee build_default.log || echo "Default build skipped"

      - name: Collect Firmware Files
        if: always()
        run: |
          mkdir -p firmware_binaries
          find . -maxdepth 3 -name "*.hex" -exec cp -v {} firmware_binaries/ \; || true
          find . -maxdepth 3 -name "*.bin" -exec cp -v {} firmware_binaries/ \; || true
          cp -v sofle_choc_mroaks_via_left.hex firmware_binaries/sofle_choc_via_left.hex 2>/dev/null || true
          cp -v sofle_choc_mroaks_via_right.hex firmware_binaries/sofle_choc_via_right.hex 2>/dev/null || true
          cp -v sofle_choc_mroaks_via.hex firmware_binaries/sofle_choc_via.hex 2>/dev/null || true
          cp -v sofle_choc_mroaks_mroaks_left.hex firmware_binaries/sofle_choc_mroaks_left.hex 2>/dev/null || true
          cp -v sofle_choc_mroaks_mroaks_right.hex firmware_binaries/sofle_choc_mroaks_right.hex 2>/dev/null || true
          cp -v *.log firmware_binaries/ || true
          ls -la firmware_binaries/

      - name: Summary & Logs
        if: always()
        run: |
          echo "### QMK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Firmware compilation completed for split keyboard:" >> $GITHUB_STEP_SUMMARY
          echo "- **VIA Left Half:** \`sofle_choc_via_left.hex\` (VIA, Layer telemetry, Spanish ISO)" >> $GITHUB_STEP_SUMMARY
          echo "- **VIA Right Half:** \`sofle_choc_via_right.hex\` (VIA, Ikki the Dog, WPM reactive)" >> $GITHUB_STEP_SUMMARY
          echo "- **mroaks Left Half:** \`sofle_choc_mroaks_left.hex\`" >> $GITHUB_STEP_SUMMARY
          echo "- **mroaks Right Half:** \`sofle_choc_mroaks_right.hex\`" >> $GITHUB_STEP_SUMMARY

      - name: Archive Firmware Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofle-choc-firmware
          path: firmware_binaries/*
