name: Build QMK Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Copy Keyboard Definition into QMK
        run: |
          mkdir -p keyboards/sofle_choc_mroaks
          cp -r my_keyboard/keyboards/sofle_choc_mroaks/* keyboards/sofle_choc_mroaks/

      - name: Build mroaks keymap
        run: |
          qmk compile -kb sofle_choc_mroaks -km mroaks -v

      - name: Build army keymap
        run: |
          qmk compile -kb sofle_choc_mroaks -km army -v || echo "Army keymap build skipped"

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sofle-choc-firmware
          path: |
            *.hex
            .build/*.hex
