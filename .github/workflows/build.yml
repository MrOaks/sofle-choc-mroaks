name: Build QMK Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Setup Keyboard in QMK
        run: |
          git config --global --add safe.directory '*'
          qmk config user.qmk_home=$(pwd)
          mkdir -p keyboards/sofle_choc_mroaks
          cp -r my_keyboard/keyboards/sofle_choc_mroaks/* keyboards/sofle_choc_mroaks/
          mkdir -p keyboards/sofle_choc
          cp -r my_keyboard/keyboards/sofle_choc_mroaks/* keyboards/sofle_choc/

      - name: Build mroaks keymap
        run: |
          make sofle_choc:mroaks 2>&1 | tee build_mroaks.log

      - name: Build default keymap
        run: |
          make sofle_choc:default 2>&1 | tee build_default.log || echo "Default build skipped"

      - name: Summary & Logs
        if: always()
        run: |
          echo "### QMK Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f build_mroaks.log ]; then
            echo "#### mroaks Keymap Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_mroaks.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Firmware Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofle-choc-firmware
          path: |
            *.hex
            .build/*.hex
            *.log
